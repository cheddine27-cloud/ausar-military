name: CI

on: [push, pull_request]

jobs:
  check:
    name: Lint and build (Ausar Military)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Production build (Vite)
        env:
          VITE_SUPABASE_URL: https://xdstewrosxrenrfrwprv.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          VITE_APP_NAME: Ausar Military
          VITE_SUPER_ADMIN_USERNAME: dummy-sa
          VITE_SUPER_ADMIN_PASSWORD: dummy-sa-password
        run: npm run build
