<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Primary Meta Tags -->
    <title>Ausar Military — نظام حضور وغياب الخدمة الوطنية</title>
    <meta name="title" content="Ausar Military — نظام حضور وغياب الخدمة الوطنية" />
    <meta name="description" content="نظام حضور وغياب عسكري — الخدمة الوطنية (أشبال الأمة، الإدارات، العسكريون الدارسون)." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ausar Military" />
    <script>
      (function () {
        var canonicalHost = 'Ausar Military.app';
        var legacyHosts = ['smartattend-seven.vercel.app'];
        if (legacyHosts.indexOf(window.location.hostname) !== -1) {
          window.location.replace(
            'https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch(error => {
            console.error('❌ Service Worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
